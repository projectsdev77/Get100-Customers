name: Daily quest nudge

# Morning email nudge for founders whose active quest hasn't moved in the
# last 24 hours (same zero-budget pattern as quest-check-ins.yml). Runs
# hourly; the endpoint only emails founders for whom it's 9-11am in their
# own saved timezone, at most once a day. Minute 7 avoids the top-of-hour
# rush when GitHub delays scheduled runs most. Requires the APP_URL and
# CRON_SECRET repo secrets.

on:
  schedule:
    - cron: "7 * * * *" # every hour at :07
  workflow_dispatch: {}

jobs:
  trigger-daily-nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily nudge endpoint
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/daily-nudge" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
